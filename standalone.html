<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1220" />
  <title>Trainingsplan – Krafttraining Tracker</title>
  <link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Training" />
  <style>
:root {
  --bg: #0f1220;
  --bg-rgb: 15,18,32;
  --bg-elev: #171b2e;
  --bg-elev-rgb: 23,27,46;
  --bg-elev2: #1f2440;
  --border: #2a2f4a;
  --text: #e8eaf2;
  --text-dim: #9aa0bd;
  --text-dim2: #6b7096;
  --accent: #6c8cff;
  --accent-2: #4a63c7;
  --good: #46c98b;
  --warn: #ffb454;
  --bad: #ff6b6b;
  --radius: 12px;
  --radius-sm: 9px;
  --tabbar-h: 58px;
  --topbar-h: 50px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

/* ---------- Themes (Einstellungen -> Design) ---------- */
/* "dark" ist das Standard-Theme und entspricht den :root-Werten oben, daher
   hier ohne eigenen Block. Die Akzentfarbe wird zusätzlich per Inline-Style
   auf documentElement gesetzt (siehe applyDisplaySettings in app.js) und
   gewinnt dadurch unabhängig vom Theme immer gegenüber diesen Regeln. */
:root[data-theme="light"] {
  --bg: #f4f5f9; --bg-rgb: 244,245,249; --bg-elev: #ffffff; --bg-elev-rgb: 255,255,255; --bg-elev2: #eceef5;
  --border: #dcdfe9; --text: #1b1e2b; --text-dim: #5b6178; --text-dim2: #868da8;
  --accent: #4a63c7; --accent-2: #34479a;
  --good: #1f9d63; --warn: #b5750a; --bad: #d13c3c;
}
:root[data-theme="oled"] {
  --bg: #000000; --bg-rgb: 0,0,0; --bg-elev: #0a0a0a; --bg-elev-rgb: 10,10,10; --bg-elev2: #151515;
  --border: #262626; --text: #f0f0f0; --text-dim: #a0a0a0; --text-dim2: #707070;
}
:root[data-theme="midnight"] {
  --bg: #0a0e27; --bg-rgb: 10,14,39; --bg-elev: #121837; --bg-elev-rgb: 18,24,55; --bg-elev2: #1a2147;
  --border: #262f5c; --text: #e6e9ff; --text-dim: #9aa3d9; --text-dim2: #6d76a8;
  --accent: #5b7fff; --accent-2: #3d5ccc;
}
:root[data-theme="forest"] {
  --bg: #0f1912; --bg-rgb: 15,25,18; --bg-elev: #16221a; --bg-elev-rgb: 22,34,26; --bg-elev2: #1e2e24;
  --border: #2a3f31; --text: #e5f0e8; --text-dim: #9fb8a8; --text-dim2: #6e8578;
  --accent: #4caf7d; --accent-2: #388a63;
}
:root[data-theme="contrast"] {
  --bg: #000000; --bg-rgb: 0,0,0; --bg-elev: #000000; --bg-elev-rgb: 0,0,0; --bg-elev2: #1a1a1a;
  --border: #ffffff; --text: #ffffff; --text-dim: #f0f0f0; --text-dim2: #d0d0d0;
  --accent: #ffe600; --accent-2: #ccb800; --good: #00ff66; --warn: #ff9900; --bad: #ff3333;
}
/* Heller Akzent im Kontrast-Theme -> schwarzer statt weißer Text für genug Kontrast */
:root[data-theme="contrast"] #restBar,
:root[data-theme="contrast"] #restBar button,
:root[data-theme="contrast"] .set-check.on { color: #000; }

/* ---------- Schriftgröße (Einstellungen -> Design) ---------- */
html[data-fontsize="small"] { font-size: 14px; }
html[data-fontsize="large"] { font-size: 18px; }

/* ---------- Animationen reduzieren (Einstellungen -> Design) ---------- */
html[data-reduced-motion="1"] *, html[data-reduced-motion="1"] *::before, html[data-reduced-motion="1"] *::after {
  transition-duration: .001ms !important; animation-duration: .001ms !important;
  animation-iteration-count: 1 !important; scroll-behavior: auto !important;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.4;
  overscroll-behavior-y: none;
}

/* ---------- Topbar ---------- */
#topbar {
  position: sticky; top: 0; z-index: 50;
  height: calc(var(--topbar-h) + var(--safe-t));
  padding-top: var(--safe-t);
  display: flex; align-items: center; gap: 6px;
  padding-left: 10px; padding-right: 10px;
  background: rgba(var(--bg-rgb), .9);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
#title {
  font-size: 1.15rem; font-weight: 700; margin: 0;
  flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#topActions { display: flex; gap: 6px; align-items: center; }

.icon-btn {
  background: transparent; border: none; color: var(--text);
  font-size: 1.6rem; line-height: 1; width: 40px; height: 40px;
  border-radius: 10px; cursor: pointer; display: grid; place-items: center;
}
.icon-btn:active { background: var(--bg-elev2); }

/* ---------- Layout ---------- */
#app {
  padding: 11px 12px calc(var(--tabbar-h) + var(--safe-b) + 16px);
  max-width: 720px; margin: 0 auto;
}

/* ---------- Tabbar ---------- */
#tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
  height: calc(var(--tabbar-h) + var(--safe-b));
  padding-bottom: var(--safe-b);
  display: flex; justify-content: space-around; align-items: stretch;
  background: rgba(var(--bg-elev-rgb), .96);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--border);
}
.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; text-decoration: none; color: var(--text-dim2);
  font-size: .68rem; font-weight: 600;
}
.tab .tico { font-size: 1.25rem; filter: grayscale(.4); opacity: .8; }
.tab.active { color: var(--accent); }
.tab.active .tico { filter: none; opacity: 1; }

/* ---------- Cards & lists ---------- */
.card {
  background: var(--bg-elev); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px; margin-bottom: 10px;
}
.card.tap { cursor: pointer; }
.card.tap:active { background: var(--bg-elev2); }

.list-row {
  display: flex; align-items: center; gap: 10px;
  background: var(--bg-elev); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 10px 12px; margin-bottom: 8px;
  cursor: pointer;
}
.list-row:active { background: var(--bg-elev2); }
.list-row .chip {
  flex: 0 0 auto; width: 38px; height: 38px; border-radius: 11px;
  display: grid; place-items: center; font-size: 1.2rem; font-weight: 700;
  background: var(--bg-elev2);
}
.list-row .grow { flex: 1; min-width: 0; }
.list-row .grow .r-title { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .95rem; }
.list-row .grow .r-sub { color: var(--text-dim); font-size: .8rem; margin-top: 1px; }
.list-row .arrow { color: var(--text-dim2); font-size: 1.2rem; }

.section-title {
  font-size: .74rem; text-transform: uppercase; letter-spacing: .06em;
  color: var(--text-dim2); font-weight: 700; margin: 14px 2px 6px;
}
.muted { color: var(--text-dim); }
.tiny { font-size: .78rem; }
.center { text-align: center; }

.empty {
  text-align: center; color: var(--text-dim); padding: 22px 16px;
  border: 1px dashed var(--border); border-radius: var(--radius);
  background: var(--bg-elev);
}
.empty .big { font-size: 1.9rem; margin-bottom: 6px; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  background: var(--bg-elev2); color: var(--text); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 10px 15px; font-size: .92rem; font-weight: 650;
  cursor: pointer; text-decoration: none; font-family: inherit;
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.good { background: var(--good); border-color: var(--good); color: #06281a; }
.btn.danger { background: transparent; border-color: var(--bad); color: var(--bad); }
.btn.ghost { background: transparent; }
.btn.block { display: flex; width: 100%; }
.btn.sm { padding: 6px 10px; font-size: .8rem; }
.btn:disabled { opacity: .45; cursor: default; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

.fab {
  position: fixed; right: 16px;
  bottom: calc(var(--tabbar-h) + var(--safe-b) + 16px);
  z-index: 45; width: 56px; height: 56px; border-radius: 50%;
  background: var(--accent); color: #fff; border: none; font-size: 1.9rem;
  box-shadow: 0 6px 18px rgba(0,0,0,.4); cursor: pointer; display: grid; place-items: center;
}
.fab:active { transform: scale(.95); }

/* ---------- Forms ---------- */
label.field { display: block; margin-bottom: 10px; }
label.field > span { display: block; font-size: .78rem; color: var(--text-dim); margin-bottom: 4px; font-weight: 600; }
input, select, textarea {
  width: 100%; background: var(--bg); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 9px 11px; font-size: .95rem; font-family: inherit;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
textarea { resize: vertical; min-height: 64px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

/* number inputs w/o spinner clutter on mobile */
input[type=number] { -moz-appearance: textfield; }
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

/* ---------- Emoji / Kürzel picker ---------- */
.emoji-pick { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
.emoji-pick button {
  width: 38px; height: 38px; border-radius: 9px; border: 1px solid var(--border);
  background: var(--bg); font-size: 1.2rem; cursor: pointer;
}
.emoji-pick button.sel { border-color: var(--accent); background: var(--bg-elev2); }
.color-pick { display: flex; gap: 7px; margin-top: 4px; flex-wrap: wrap; }
.color-pick button {
  width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; cursor: pointer;
}
.color-pick button.sel { border-color: var(--text); }

.theme-pick { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.theme-pick button {
  padding: 8px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border);
  background: var(--bg); color: var(--text); font-size: .85rem; cursor: pointer; font-family: inherit;
}
.theme-pick button.sel { border-color: var(--accent); background: rgba(108, 140, 255, .12); font-weight: 700; }

/* ---------- Training screen ---------- */
.train-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.train-head .chip { width: 44px; height: 44px; border-radius: 11px; display: grid; place-items: center; font-size: 1.4rem; background: var(--bg-elev2); }

.ex-block { background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
.ex-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
.ex-head .ex-name { flex: 1; font-weight: 700; font-size: .95rem; }
.ex-head [data-menu] { font-size: 1.3rem; line-height: 1; padding: 4px 10px; }
.ex-meta { padding: 0 12px 8px; }
.ex-note {
  margin-top: 6px; padding: 7px 10px; background: var(--bg-elev2); border-radius: var(--radius-sm);
  font-size: .82rem; color: var(--text-dim); border-left: 3px solid var(--warn);
}
.ex-body { padding: 9px 10px 10px; border-top: 1px solid var(--border); }

.set-row { display: grid; grid-template-columns: 26px 1fr 1fr 44px; gap: 8px; align-items: center; margin-bottom: 8px; }
.set-row .setno { color: var(--text-dim2); font-weight: 700; text-align: center; font-size: .9rem; }
.set-row input { padding: 9px 8px; text-align: center; }
.set-row.done input { border-color: var(--good); }
.set-check { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); font-size: 1.1rem; cursor: pointer; display: grid; place-items: center; }
.set-check.on { background: var(--good); border-color: var(--good); color: #06281a; }
.set-head { display: grid; grid-template-columns: 26px 1fr 1fr 44px; gap: 8px; font-size: .7rem; color: var(--text-dim2); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; padding: 0 2px; }
.set-head span { text-align: center; }

/* ---------- Supersätze/Zirkel (Training) ---------- */
.superset-wrap {
  border: 2px solid var(--accent-2); border-radius: var(--radius); padding: 8px;
  margin-bottom: 10px; background: rgba(108, 140, 255, .05);
}
.superset-wrap .ex-block { margin-bottom: 8px; }
.superset-wrap .ex-block:last-child { margin-bottom: 0; }
.superset-label { font-size: .74rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .04em; padding: 2px 4px 8px; }

.select-bar {
  position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar-h) + var(--safe-b));
  z-index: 40; display: flex; gap: 8px; padding: 10px 12px;
  background: var(--bg-elev); border-top: 1px solid var(--border);
  box-shadow: 0 -4px 16px rgba(0,0,0,.25);
}
.select-bar .btn { flex: 1; }
.select-card {
  display: flex; align-items: center; gap: 10px; cursor: pointer;
}
.select-check {
  flex-shrink: 0; width: 26px; height: 26px; border-radius: 8px;
  border: 2px solid var(--border); background: var(--bg); display: grid; place-items: center;
  font-size: .85rem; color: transparent;
}
.select-check.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.select-card.sel { border-color: var(--accent); background: rgba(108, 140, 255, .08); }

/* ---------- Muskelgruppen-Volumen (Statistik) ---------- */
.vol-row { display: grid; grid-template-columns: 92px 1fr 56px; gap: 8px; align-items: center; margin-bottom: 8px; }
.vol-label { font-size: .82rem; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vol-bar-track { height: 10px; border-radius: 6px; background: var(--bg-elev2); overflow: hidden; }
.vol-bar-fill { height: 100%; background: var(--accent); border-radius: 6px; }
.vol-val { font-size: .78rem; color: var(--text-dim2); text-align: right; }

/* ---------- Aktions-Menü (Übung im Training) ---------- */
.sheet { display: flex; flex-direction: column; gap: 6px; }
.sheet-btn {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
  background: var(--bg-elev2); border: 1px solid var(--border); color: var(--text);
  border-radius: var(--radius-sm); padding: 12px 14px; font-size: .92rem; font-weight: 600;
  cursor: pointer; font-family: inherit;
}
.sheet-btn:active { transform: translateY(1px); }
.sheet-btn.danger { color: var(--bad); }
.sheet-btn.split { padding: 0; overflow: hidden; cursor: default; }
.sheet-btn.split .split-half {
  flex: 0 0 25%; align-self: stretch; background: transparent; border: none; color: var(--text);
  font-size: 1.3rem; font-weight: 700; cursor: pointer; font-family: inherit; line-height: 1;
  padding: 12px 10px; display: flex; align-items: center; justify-content: center;
}
.sheet-btn.split .split-half:first-child { border-right: 1px solid var(--border); }
.sheet-btn.split .split-half:last-child { border-left: 1px solid var(--border); }
.sheet-btn.split .split-half:active { background: rgba(255, 255, 255, .06); }
.sheet-btn.split .split-label { flex: 1; text-align: center; font-size: .88rem; align-self: center; }

/* ---------- Muskel-/Geräte-Labels ---------- */
.tag-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
.tag-badge { font-size: .72rem; font-weight: 650; padding: 2px 9px; border-radius: 999px; }
.tag-badge.muscle { background: rgba(125, 211, 252, .16); color: #7dd3fc; }
.tag-badge.equip { background: rgba(134, 239, 172, .16); color: #86efac; }
.tag-badge.neutral { background: var(--bg-elev2); color: var(--text-dim); border: 1px solid var(--border); }

/* ---------- Rest timer ---------- */
#restBar {
  position: fixed; left: 50%; transform: translateX(-50%);
  top: calc(var(--topbar-h) + var(--safe-t) + 8px);
  z-index: 60; background: var(--accent); color: #fff;
  border-radius: 999px; padding: 10px 16px; display: flex; align-items: center; gap: 14px;
  box-shadow: 0 6px 20px rgba(0,0,0,.45); font-weight: 700;
  max-width: calc(100% - 24px);
}
#restBar.hidden { display: none; }
#restBar .rt-time { font-variant-numeric: tabular-nums; font-size: 1.15rem; min-width: 52px; text-align: center; }
#restBar button { background: rgba(255,255,255,.2); border: none; color: #fff; border-radius: 999px; padding: 6px 12px; font-weight: 700; cursor: pointer; }

/* ---------- Modal ---------- */
.modal-back { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; }
.modal {
  background: var(--bg-elev); border: 1px solid var(--border);
  border-radius: 18px 18px 0 0; width: 100%; max-width: 560px;
  max-height: 88vh; overflow-y: auto; padding: 18px 16px calc(20px + var(--safe-b));
  animation: slideUp .18s ease;
}
@keyframes slideUp { from { transform: translateY(30px); opacity: .6; } to { transform: none; opacity: 1; } }
.modal h2 { margin: 0 0 14px; font-size: 1.1rem; }
@media (min-width: 620px) {
  .modal-back { align-items: center; }
  .modal { border-radius: 18px; }
}

/* ---------- Chips / badges ---------- */
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { font-size: .72rem; padding: 3px 8px; border-radius: 999px; background: var(--bg-elev2); color: var(--text-dim); border: 1px solid var(--border); }
.badge.accent { color: var(--accent); border-color: var(--accent-2); }

/* ---------- Calendar ---------- */
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cal-head h2 { margin: 0; font-size: 1.1rem; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal-dow { text-align: center; font-size: .68rem; color: var(--text-dim2); font-weight: 700; padding-bottom: 2px; }
.cal-cell {
  aspect-ratio: 1 / 1; border: 1px solid var(--border); border-radius: 10px;
  background: var(--bg-elev); display: flex; flex-direction: column; align-items: center; justify-content: center;
  position: relative; font-size: .7rem; overflow: hidden; cursor: pointer;
}
.cal-cell.empty-cell { background: transparent; border-color: transparent; cursor: default; }
.cal-cell .cal-day { position: absolute; top: 3px; left: 5px; color: var(--text-dim2); font-size: .62rem; }
.cal-cell.today { border-color: var(--accent); }
.cal-cell .cal-emojis { font-size: 1.05rem; line-height: 1.05; display: flex; flex-wrap: wrap; justify-content: center; gap: 1px; margin-top: 6px; }
.cal-cell .cal-kuerzel { font-size: .62rem; font-weight: 700; margin-top: 2px; padding: 0 3px; border-radius: 4px; }
.cal-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.cal-legend .li { display: flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--text-dim); }
.cal-legend .dot { width: 12px; height: 12px; border-radius: 4px; }

.streak-row { display: flex; gap: 10px; margin-bottom: 12px; }
.stat-tile { flex: 1; background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; text-align: center; }
.stat-tile .v { font-size: 1.5rem; font-weight: 800; }
.stat-tile .l { font-size: .72rem; color: var(--text-dim); margin-top: 2px; }

/* ---------- Chart ---------- */
.chart-wrap { background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 12px; }
.chart-wrap .c-title { font-size: .82rem; color: var(--text-dim); font-weight: 650; margin-bottom: 8px; display:flex; justify-content: space-between; }
svg.chart { width: 100%; height: 140px; display: block; }
.chart-line { fill: none; stroke: var(--accent); stroke-width: 2; }
.chart-area { fill: url(#grad); opacity: .18; }
.chart-dot { fill: var(--accent); }
.chart-grid { stroke: var(--border); stroke-width: 1; }
.chart-lbl { fill: var(--text-dim2); font-size: 9px; }

table.hist { width: 100%; border-collapse: collapse; font-size: .84rem; }
table.hist th, table.hist td { padding: 7px 6px; text-align: left; border-bottom: 1px solid var(--border); }
table.hist th { color: var(--text-dim2); font-size: .72rem; text-transform: uppercase; font-weight: 700; }
table.hist td.num { text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- Toast ---------- */
#toastRoot { position: fixed; bottom: calc(var(--tabbar-h) + var(--safe-b) + 74px); left: 0; right: 0; z-index: 120; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.toast { background: var(--bg-elev2); color: var(--text); border: 1px solid var(--border); border-radius: 999px; padding: 9px 16px; font-size: .88rem; font-weight: 600; box-shadow: 0 4px 14px rgba(0,0,0,.4); animation: fade .2s; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; } }

.drag-handle { cursor: grab; color: var(--text-dim2); font-size: 1.2rem; padding: 0 2px; touch-action: none; }
.dragging { opacity: .5; }

hr.sep { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
a { color: var(--accent); }

/* ---------- Orts-Reiter (oben) & Orts-Kürzel ---------- */
.loc-bar {
  display: flex; gap: 7px; overflow-x: auto; padding: 2px 0 10px; margin: -2px 0 4px;
  -webkit-overflow-scrolling: touch; scrollbar-width: none;
}
.loc-bar::-webkit-scrollbar { display: none; }
.loc-chip {
  flex: 0 0 auto; display: flex; align-items: center; gap: 5px;
  background: var(--bg-elev); border: 1px solid var(--border); color: var(--text-dim);
  border-radius: 999px; padding: 7px 13px; font-size: .85rem; font-weight: 650;
  cursor: pointer; white-space: nowrap; font-family: inherit;
}
.loc-chip:active { transform: translateY(1px); }
.loc-chip.sel { background: var(--accent); border-color: var(--accent); color: #fff; }
.loc-chip.add { color: var(--text-dim2); font-size: 1.1rem; padding: 7px 13px; }
.loc-chip-edit { font-size: .78rem; opacity: .85; }
.loc-badge {
  display: inline-flex; align-items: center; gap: 3px; font-size: .76rem; font-weight: 700;
  background: var(--bg-elev2); border: 1px solid var(--border); border-radius: 6px;
  padding: 0 5px; margin-left: 4px; vertical-align: middle;
}

/* ---------- Übungsbibliothek: Filter (Ausklappmenüs) ---------- */
.filter-acc {
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius-sm);
  margin-bottom: 6px; overflow: hidden;
}
.filter-acc summary {
  list-style: none; cursor: pointer; padding: 10px 12px; display: flex; align-items: center;
  font-size: .86rem; font-weight: 650; color: var(--text);
}
.filter-acc summary::-webkit-details-marker { display: none; }
.filter-acc summary::after { content: '⌄'; color: var(--text-dim2); margin-left: auto; font-size: 1rem; transition: transform .15s; }
.filter-acc[open] summary::after { transform: rotate(180deg); }
.filter-acc .filter-row { padding: 0 10px 10px; }
.acc-badge {
  background: var(--accent); color: #fff; font-size: .7rem; font-weight: 700;
  border-radius: 999px; padding: 1px 7px; margin-left: 8px; min-width: 16px; text-align: center;
}
.filter-row { display: flex; gap: 6px; flex-wrap: wrap; }
.filter-chip {
  background: var(--bg-elev); border: 1px solid var(--border); color: var(--text-dim);
  border-radius: 999px; padding: 6px 12px; font-size: .78rem; font-weight: 600;
  cursor: pointer; font-family: inherit; white-space: nowrap;
}
.filter-chip:active { transform: translateY(1px); }
.filter-chip.sel { background: var(--accent-2); border-color: var(--accent); color: #fff; }

/* ---------- Pläne: aufklappbare Trainingstage ---------- */
.plan-acc {
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius);
  margin-bottom: 8px; overflow: hidden;
}
.plan-acc summary {
  list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
}
.plan-acc summary::-webkit-details-marker { display: none; }
.plan-acc summary .chip {
  flex: 0 0 auto; width: 38px; height: 38px; border-radius: 11px;
  display: grid; place-items: center; font-size: 1.2rem; font-weight: 700;
}
.plan-acc summary .r-title { font-weight: 650; font-size: .95rem; }
.plan-acc summary .r-sub { color: var(--text-dim); font-size: .8rem; margin-top: 1px; }
.plan-acc .acc-chevron { color: var(--text-dim2); font-size: 1.1rem; transition: transform .15s; }
.plan-acc[open] .acc-chevron { transform: rotate(180deg); }
.plan-acc-body { padding: 0 10px 10px; }
.plan-acc-body .list-row:last-child { margin-bottom: 0; }

/* ---------- Trainings-Anpassungen nach dem Training (Diff-Modal) ---------- */
.diff-list { display: flex; flex-direction: column; gap: 2px; }
.diff-row {
  display: flex; align-items: flex-start; gap: 10px; padding: 9px 4px; font-size: .88rem;
  border-bottom: 1px solid var(--border); cursor: pointer; line-height: 1.35;
}
.diff-row:last-child { border-bottom: none; }
.diff-row input { width: auto; flex: 0 0 auto; margin-top: 3px; }
.diff-row span { flex: 1; }

<body>
  <header id="topbar">
    <button id="backBtn" class="icon-btn" aria-label="Zurück" hidden>‹</button>
    <h1 id="title">Training</h1>
    <div id="topActions"></div>
  </header>

  <main id="app"><!-- views render here --></main>

  <nav id="tabbar">
    <a href="#/plans" class="tab" data-tab="plans"><span class="tico">📋</span><span>Pläne</span></a>
    <a href="#/calendar" class="tab" data-tab="calendar"><span class="tico">📅</span><span>Kalender</span></a>
    <a href="#/stats" class="tab" data-tab="stats"><span class="tico">📈</span><span>Statistik</span></a>
    <a href="#/library" class="tab" data-tab="library"><span class="tico">📚</span><span>Übungen</span></a>
    <a href="#/settings" class="tab" data-tab="settings"><span class="tico">⚙️</span><span>Einstellungen</span></a>
  </nav>

  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

  <script>
const DB = (() => {
// ============================================================
//  db.js – lokale Datenhaltung (localStorage) + CRUD + Statistik
//  Hierarchie:  Ort -> Trainingsplan -> Trainingstag -> Übungen
//  Übungen stammen aus der wiederverwendbaren Übungsbibliothek.
// ============================================================

const KEY = 'trainingsplan.v1';

// Einmalige Content-Migration: wenn settings.seedVersion < SEED_VERSION, wird der
// Store beim Start geleert und mit dem kuratierten Startinhalt (Sports Club Kiel +
// Push/Pull/Legs + Übungsbibliothek) neu befüllt. wipeAll() setzt seedVersion
// direkt auf SEED_VERSION, damit ein manuelles "Alle Daten löschen" NICHT erneut
// automatisch befüllt wird (nur diese eine automatische Migration tut das).
const SEED_VERSION = 3;

// Muskelgruppen UND Geräte-Arten sind beide selbst verwaltbar (siehe
// muscleGroups()/equipmentTypes() u.a. unten) - diese Listen sind nur der
// Startbestand für neue/bestehende Installationen.
const DEFAULT_MUSCLES = ['Brust', 'Rücken', 'Schultern', 'Bizeps', 'Trizeps', 'Unterarme', 'Quadrizeps', 'Beinbeuger', 'Gesäß', 'Waden', 'Bauch', 'Ganzkörper'];
const DEFAULT_EQUIPMENT = ['Langhantel', 'Kurzhantel', 'Maschine', 'Kabelzug', 'Körpergewicht', 'Kettlebell', 'Sonstiges'];

const DEFAULTS = () => ({
  version: 1,
  settings: {
    // Training
    defaultRestSec: 90, soundOnRestEnd: true, defaultSets: 3, defaultReps: 10,
    weekStart: 'mon', askPlanDiff: true, restNotifications: false,
    // Anzeige/Design
    tagColors: true, theme: 'dark', accentColor: '#6c8cff', fontSize: 'medium', reducedMotion: false,
    // Daten
    backupReminderWeeks: 0, lastBackupAt: null, demoDataEnabled: false,
    // intern
    seedVersion: 0,
  },
  exercises: [],   // Bibliothek: {id,name,muscles[],equipment,notes,unit,createdAt}
  muscleGroups: DEFAULT_MUSCLES.map(name => ({ id: uid('mg'), name, createdAt: Date.now() })),   // {id,name,createdAt}
  equipmentTypes: DEFAULT_EQUIPMENT.map(name => ({ id: uid('eq'), name, createdAt: Date.now() })), // {id,name,createdAt}
  exerciseNotes: [], // Dauerhafte Geräte-/Einstellungs-Notiz je Übung UND Ort: {id,exerciseId,locationId,text,updatedAt}
  locations: [],   // Orte:        {id,name,emoji,color,createdAt}
  plans: [],       // Pläne:       {id,locationId,name,emoji,color,createdAt}
  days: [],        // Trainingstage:{id,planId,name,emoji,color,order,exercises:[{id,exerciseId,sets,reps,restSec,groupId}],createdAt}
  sessions: [],    // Einheiten:   {id,locationId,planId,dayId,dayName,date,startedAt,finishedAt,emoji,color,note,entries:[...],planSnapshot:[...]}
  trashExercises: [], // Papierkorb: gelöschte Übungen, {..exercise, deletedAt}
  trashSessions: [],  // Papierkorb: gelöschte/verworfene Trainings, {..session, deletedAt}
});

let store = null;

// ---------- Basis ----------
function db() {
  if (store) return store;
  try {
    const raw = localStorage.getItem(KEY);
    store = raw ? JSON.parse(raw) : DEFAULTS();
  } catch (e) {
    console.error('Konnte Daten nicht laden, starte leer', e);
    store = DEFAULTS();
  }
  // Felder absichern (Migration/Robustheit)
  const d = DEFAULTS();
  for (const k of Object.keys(d)) if (store[k] === undefined) store[k] = d[k];
  store.settings = Object.assign(d.settings, store.settings || {});
  return store;
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(store));
  } catch (e) {
    console.error('Speichern fehlgeschlagen', e);
    alert('Speichern fehlgeschlagen – evtl. ist der Speicher voll.');
  }
}

function uid(p = 'id') {
  return p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

// ---------- Übungsbibliothek ----------
function exercises() { return db().exercises.slice().sort((a, b) => a.name.localeCompare(b.name, 'de')); }
function getExercise(id) { return db().exercises.find(e => e.id === id) || null; }
function addExercise(data) {
  const ex = { id: uid('ex'), name: '', muscles: [], equipment: '', notes: '', unit: 'kg', createdAt: Date.now(), ...data };
  db().exercises.push(ex); save(); return ex;
}
function updateExercise(id, patch) {
  const ex = getExercise(id); if (!ex) return; Object.assign(ex, patch); save(); return ex;
}
// Verschiebt die Übung in den Papierkorb (Wiederherstellbar), statt sie
// endgültig zu löschen. Wird trotzdem aus allen Trainingstagen entfernt -
// eine Wiederherstellung bringt die Übung nur in die Bibliothek zurück,
// nicht automatisch in die Trainingstage, aus denen sie entfernt wurde.
function deleteExercise(id) {
  const d = db();
  const ex = d.exercises.find(e => e.id === id);
  if (!ex) return;
  d.exercises = d.exercises.filter(e => e.id !== id);
  d.days.forEach(day => { day.exercises = day.exercises.filter(x => x.exerciseId !== id); });
  d.exerciseNotes = d.exerciseNotes.filter(n => n.exerciseId !== id);
  d.trashExercises.push({ ...ex, deletedAt: Date.now() });
  save();
}
function trashedExercises() { return db().trashExercises.slice().sort((a, b) => b.deletedAt - a.deletedAt); }
function restoreExercise(id) {
  const d = db();
  const ex = d.trashExercises.find(e => e.id === id);
  if (!ex) return null;
  d.trashExercises = d.trashExercises.filter(e => e.id !== id);
  const { deletedAt, ...restored } = ex;
  d.exercises.push(restored);
  save();
  return restored;
}
function purgeTrashedExercise(id) {
  const d = db(); d.trashExercises = d.trashExercises.filter(e => e.id !== id); save();
}
// Wie oft wurde eine Übung in Einheiten genutzt (für Löschwarnung)
function exerciseUsage(id) {
  return db().sessions.filter(s => (s.entries || []).some(e => e.exerciseId === id)).length;
}

// ---------- Dauerhafte Geräte-/Einstellungs-Notiz je Übung + Ort ----------
// Getrennt vom allgemeinen Übungs-"notes"-Feld (Technik-Hinweise, ortsunabhängig):
// Geräte-Einstellungen (z.B. Sitzhöhe) sind zwischen Gyms nicht vergleichbar,
// deshalb eine eigene Notiz je (Übung, Ort)-Kombination.
function getExerciseNote(exerciseId, locationId) {
  if (!exerciseId || !locationId) return null;
  return db().exerciseNotes.find(n => n.exerciseId === exerciseId && n.locationId === locationId) || null;
}
function setExerciseNote(exerciseId, locationId, text) {
  if (!exerciseId || !locationId) return null;
  text = String(text || '').trim();
  const d = db();
  let n = d.exerciseNotes.find(x => x.exerciseId === exerciseId && x.locationId === locationId);
  if (!text) {
    if (n) d.exerciseNotes = d.exerciseNotes.filter(x => x !== n);
    save();
    return null;
  }
  if (n) { n.text = text; n.updatedAt = Date.now(); }
  else { n = { id: uid('exn'), exerciseId, locationId, text, updatedAt: Date.now() }; d.exerciseNotes.push(n); }
  save();
  return n;
}

// ---------- Muskelgruppen (selbst verwaltbar, für Filter + Übungs-Tagging) ----------
function muscleGroups() { return db().muscleGroups.slice().sort((a, b) => a.name.localeCompare(b.name, 'de')); }
function getMuscleGroup(id) { return db().muscleGroups.find(m => m.id === id) || null; }
function addMuscleGroup(name) {
  name = String(name || '').trim(); if (!name) return null;
  const existing = db().muscleGroups.find(m => m.name.toLowerCase() === name.toLowerCase());
  if (existing) return existing;
  const m = { id: uid('mg'), name, createdAt: Date.now() };
  db().muscleGroups.push(m); save(); return m;
}
function renameMuscleGroup(id, newName) {
  newName = String(newName || '').trim(); if (!newName) return;
  const m = getMuscleGroup(id); if (!m) return;
  const oldName = m.name;
  m.name = newName;
  if (oldName !== newName) {
    db().exercises.forEach(ex => {
      if ((ex.muscles || []).includes(oldName)) ex.muscles = ex.muscles.map(x => x === oldName ? newName : x);
    });
  }
  save();
}
function deleteMuscleGroup(id) {
  const m = getMuscleGroup(id); if (!m) return;
  db().exercises.forEach(ex => { ex.muscles = (ex.muscles || []).filter(x => x !== m.name); });
  db().muscleGroups = db().muscleGroups.filter(x => x.id !== id);
  save();
}
function muscleGroupUsage(id) {
  const m = getMuscleGroup(id); if (!m) return 0;
  return db().exercises.filter(ex => (ex.muscles || []).includes(m.name)).length;
}

// ---------- Geräte-Arten (selbst verwaltbar, für Filter + Übungs-Tagging) ----------
function equipmentTypes() { return db().equipmentTypes.slice().sort((a, b) => a.name.localeCompare(b.name, 'de')); }
function getEquipmentType(id) { return db().equipmentTypes.find(e => e.id === id) || null; }
function addEquipmentType(name) {
  name = String(name || '').trim(); if (!name) return null;
  const existing = db().equipmentTypes.find(e => e.name.toLowerCase() === name.toLowerCase());
  if (existing) return existing;
  const e = { id: uid('eq'), name, createdAt: Date.now() };
  db().equipmentTypes.push(e); save(); return e;
}
function renameEquipmentType(id, newName) {
  newName = String(newName || '').trim(); if (!newName) return;
  const e = getEquipmentType(id); if (!e) return;
  const oldName = e.name;
  e.name = newName;
  if (oldName !== newName) {
    db().exercises.forEach(ex => { if (ex.equipment === oldName) ex.equipment = newName; });
  }
  save();
}
function deleteEquipmentType(id) {
  const e = getEquipmentType(id); if (!e) return;
  db().exercises.forEach(ex => { if (ex.equipment === e.name) ex.equipment = ''; });
  db().equipmentTypes = db().equipmentTypes.filter(x => x.id !== id);
  save();
}
function equipmentUsage(id) {
  const e = getEquipmentType(id); if (!e) return 0;
  return db().exercises.filter(ex => ex.equipment === e.name).length;
}

// ---------- Orte ----------
function locations() { return db().locations.slice(); }
function getLocation(id) { return db().locations.find(l => l.id === id) || null; }

// Aktiver Ort (globaler Filter / oberer Reiter). Fällt auf den ersten Ort zurück.
function getActiveLocationId() {
  const d = db();
  let id = d.settings.activeLocationId;
  if (!id || !d.locations.some(l => l.id === id)) {
    id = d.locations.length ? d.locations[0].id : null;
    d.settings.activeLocationId = id;
  }
  return id;
}
function getActiveLocation() { const id = getActiveLocationId(); return id ? getLocation(id) : null; }
function setActiveLocation(id) { db().settings.activeLocationId = id; save(); }
function addLocation(data) {
  const l = { id: uid('loc'), name: '', emoji: '📍', color: '#6c8cff', createdAt: Date.now(), ...data };
  db().locations.push(l);
  db().settings.activeLocationId = l.id; // neuen Ort direkt aktiv setzen
  save(); return l;
}
function updateLocation(id, patch) { const l = getLocation(id); if (l) { Object.assign(l, patch); save(); } return l; }
function deleteLocation(id) {
  const d = db();
  const planIds = d.plans.filter(p => p.locationId === id).map(p => p.id);
  d.plans = d.plans.filter(p => p.locationId !== id);
  d.days = d.days.filter(day => !planIds.includes(day.planId));
  d.locations = d.locations.filter(l => l.id !== id);
  d.exerciseNotes = d.exerciseNotes.filter(n => n.locationId !== id);
  save();
}

// ---------- Pläne ----------
function plansByLocation(locId) { return db().plans.filter(p => p.locationId === locId); }
function getPlan(id) { return db().plans.find(p => p.id === id) || null; }
function addPlan(data) {
  const p = { id: uid('plan'), locationId: null, name: '', emoji: '🏋️', color: '#6c8cff', createdAt: Date.now(), ...data };
  db().plans.push(p); save(); return p;
}
function updatePlan(id, patch) { const p = getPlan(id); if (p) { Object.assign(p, patch); save(); } return p; }
function deletePlan(id) {
  const d = db();
  d.days = d.days.filter(day => day.planId !== id);
  d.plans = d.plans.filter(p => p.id !== id);
  save();
}

// Kopiert einen Plan (mit allen Trainingstagen & Zielwerten) als unabhängige
// Kopie an einen anderen Ort. Übungen werden dabei NICHT dupliziert -
// die Bibliothek ist ortübergreifend gemeinsam (jedes Gym hat z.B. eine
// Brustpresse), nur die Statistik/das "letztes Mal" bleibt je Ort getrennt.
// Die Kopie ist danach vollständig unabhängig vom Original editierbar.
function copyPlanToLocation(planId, targetLocationId) {
  const p = getPlan(planId); if (!p) return null;
  const newPlan = addPlan({ name: p.name, emoji: p.emoji, color: p.color, locationId: targetLocationId });
  daysByPlan(planId).forEach(day => {
    const newDay = addDay({ name: day.name, emoji: day.emoji, color: day.color, planId: newPlan.id });
    day.exercises.forEach(item => addExerciseToDay(newDay.id, item.exerciseId, { sets: item.sets, reps: item.reps, restSec: item.restSec }));
  });
  return newPlan;
}

// ---------- Trainingstage ----------
function daysByPlan(planId) {
  return db().days.filter(day => day.planId === planId).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
}
function getDay(id) { return db().days.find(day => day.id === id) || null; }
function addDay(data) {
  const order = daysByPlan(data.planId).length;
  const day = { id: uid('day'), planId: null, name: '', emoji: '💪', color: '#46c98b', order, exercises: [], createdAt: Date.now(), ...data };
  db().days.push(day); save(); return day;
}
function updateDay(id, patch) { const day = getDay(id); if (day) { Object.assign(day, patch); save(); } return day; }
function deleteDay(id) { const d = db(); d.days = d.days.filter(day => day.id !== id); save(); }
function reorderDays(planId, orderedIds) {
  orderedIds.forEach((id, i) => { const day = getDay(id); if (day) day.order = i; });
  save();
}

// Übung innerhalb eines Trainingstags
function addExerciseToDay(dayId, exerciseId, opts = {}) {
  const day = getDay(dayId); if (!day) return;
  const s = db().settings;
  const item = { id: uid('de'), exerciseId, sets: opts.sets ?? s.defaultSets, reps: opts.reps ?? s.defaultReps, restSec: opts.restSec ?? s.defaultRestSec, groupId: opts.groupId ?? null };
  day.exercises.push(item); save(); return item;
}
function updateDayExercise(dayId, itemId, patch) {
  const day = getDay(dayId); if (!day) return;
  const it = day.exercises.find(x => x.id === itemId); if (it) { Object.assign(it, patch); save(); }
  return it;
}
function removeDayExercise(dayId, itemId) {
  const day = getDay(dayId); if (!day) return;
  day.exercises = day.exercises.filter(x => x.id !== itemId); save();
}
function reorderDayExercises(dayId, orderedItemIds) {
  const day = getDay(dayId); if (!day) return;
  day.exercises.sort((a, b) => orderedItemIds.indexOf(a.id) - orderedItemIds.indexOf(b.id));
  save();
}

// ---------- Supersätze/Zirkel (mehrere Übungen zu einer Gruppe verbinden) ----------
// Gruppierte Übungen werden zu einem zusammenhängenden Block verschoben
// (in der ursprünglichen relativen Reihenfolge der Auswahl) - ein Zirkel
// muss lückenlos hintereinander stehen, sonst ergibt "keine Pause dazwischen"
// keinen Sinn.
// Kernlogik ohne save() (wird auch beim Übernehmen von Trainings-Diffs wiederverwendet).
function regroupContiguous(day, itemIds) {
  if (itemIds.length < 2) return null;
  const groupId = uid('grp');
  const idSet = new Set(itemIds);
  // Reihenfolge der Auswahl beibehalten (nicht die alte Listenreihenfolge)
  const selected = itemIds.map(id => day.exercises.find(x => x.id === id)).filter(Boolean);
  if (selected.length < 2) return null;
  selected.forEach(item => { item.groupId = groupId; });
  // Block an die Position des ersten ausgewählten Elements verschieben,
  // alle anderen Elemente behalten ihre relative Reihenfolge.
  const insertAt = day.exercises.findIndex(x => idSet.has(x.id));
  const others = day.exercises.filter(x => !idSet.has(x.id));
  const insertAtInOthers = day.exercises.slice(0, insertAt).filter(x => !idSet.has(x.id)).length;
  others.splice(insertAtInOthers, 0, ...selected);
  day.exercises = others;
  return groupId;
}
function groupExercises(dayId, itemIds) {
  const day = getDay(dayId); if (!day) return;
  const groupId = regroupContiguous(day, itemIds);
  if (groupId) save();
  return groupId;
}
function ungroupExercises(dayId, groupId) {
  const day = getDay(dayId); if (!day) return;
  day.exercises.forEach(x => { if (x.groupId === groupId) x.groupId = null; });
  save();
}

// ---------- Einheiten (Sessions / durchgeführtes Training) ----------
function sessions() {
  return db().sessions.slice().sort((a, b) => (b.startedAt || 0) - (a.startedAt || 0));
}
function getSession(id) { return db().sessions.find(s => s.id === id) || null; }

// Neue Einheit aus einem Trainingstag erzeugen (mit Zielwerten vorbefüllt)
function startSession(dayId) {
  const day = getDay(dayId); if (!day) return null;
  const plan = getPlan(day.planId);
  const loc = plan ? getLocation(plan.locationId) : null;
  const entries = day.exercises.map(item => {
    const ex = getExercise(item.exerciseId);
    const sets = [];
    for (let i = 0; i < (item.sets || 1); i++) sets.push({ weight: '', reps: '', done: false });
    return {
      exerciseId: item.exerciseId,
      name: ex ? ex.name : '(gelöschte Übung)',
      unit: ex ? (ex.unit || 'kg') : 'kg',
      targetReps: item.reps,
      targetSets: item.sets,
      restSec: item.restSec,
      groupId: item.groupId || null,
      sets,
    };
  });
  const now = Date.now();
  const s = {
    id: uid('ses'),
    locationId: loc ? loc.id : null,
    planId: plan ? plan.id : null,
    dayId: day.id,
    dayName: day.name,
    date: todayISO(),
    startedAt: now,
    finishedAt: null,
    emoji: day.emoji || plan?.emoji || '💪',
    color: day.color || plan?.color || '#46c98b',
    note: '',
    entries,
    // Schnappschuss des Plans zum Trainingsstart -> Basis für den Diff beim Beenden
    // (Trainingstag könnte sich zwischenzeitlich ändern oder gelöscht werden).
    planSnapshot: day.exercises.map(item => ({ exerciseId: item.exerciseId, sets: item.sets, reps: item.reps, restSec: item.restSec, groupId: item.groupId || null })),
  };
  db().sessions.push(s); save(); return s;
}
function updateSession(id, patch) { const s = getSession(id); if (s) { Object.assign(s, patch); save(); } return s; }
// Verschiebt das Training in den Papierkorb, statt es endgültig zu löschen.
function deleteSession(id) {
  const d = db();
  const s = d.sessions.find(x => x.id === id);
  if (!s) return;
  d.sessions = d.sessions.filter(x => x.id !== id);
  d.trashSessions.push({ ...s, deletedAt: Date.now() });
  save();
}
function trashedSessions() { return db().trashSessions.slice().sort((a, b) => b.deletedAt - a.deletedAt); }
function restoreSession(id) {
  const d = db();
  const s = d.trashSessions.find(x => x.id === id);
  if (!s) return null;
  d.trashSessions = d.trashSessions.filter(x => x.id !== id);
  const { deletedAt, ...restored } = s;
  d.sessions.push(restored);
  save();
  return restored;
}
function purgeTrashedSession(id) {
  const d = db(); d.trashSessions = d.trashSessions.filter(x => x.id !== id); save();
}
function emptyTrash() {
  const d = db(); d.trashExercises = []; d.trashSessions = []; save();
}

// ---------- Anpassungen während des Trainings zurück in den Plan übernehmen ----------
// Vergleicht den aktuellen Stand der Einheit mit dem Schnappschuss bei Trainingsstart
// und liefert einzeln auswählbare Änderungen (Pause/Sätze pro Übung, hinzugefügte/
// entfernte Übungen, Reihenfolge). Ohne planSnapshot oder gelöschten Trainingstag: keine Diffs.
// Wichtig: "hinzugefügt"/"Sätze geändert" hängen NICHT davon ab, ob im Training
// tatsächlich ein Satz abgehakt wurde - das Hinzufügen/Entfernen einer Übung oder
// eines Satzes über das "⋮"-Menü ist bereits eine explizite Handlung des Nutzers.
function computeSessionPlanDiff(sessionId) {
  const s = getSession(sessionId);
  if (!s || !s.planSnapshot) return [];
  const day = getDay(s.dayId);
  if (!day) return [];
  const settings = db().settings;
  const snapMap = new Map(s.planSnapshot.map(x => [x.exerciseId, x]));
  const entryMap = new Map(s.entries.map(x => [x.exerciseId, x]));
  const diffs = [];
  for (const entry of s.entries) {
    const snap = snapMap.get(entry.exerciseId);
    if (!snap) {
      diffs.push({
        type: 'exerciseAdded', exerciseId: entry.exerciseId, name: entry.name,
        sets: (entry.sets || []).length || settings.defaultSets,
        reps: entry.targetReps || settings.defaultReps,
        restSec: entry.restSec ?? settings.defaultRestSec,
      });
      continue;
    }
    if (entry.restSec !== snap.restSec) {
      diffs.push({ type: 'restChanged', exerciseId: entry.exerciseId, name: entry.name, oldVal: snap.restSec, newVal: entry.restSec });
    }
    const setCount = (entry.sets || []).length;
    if (setCount !== snap.sets) {
      diffs.push({ type: 'setsChanged', exerciseId: entry.exerciseId, name: entry.name, oldVal: snap.sets, newVal: setCount });
    }
  }
  for (const snap of s.planSnapshot) {
    if (!entryMap.has(snap.exerciseId)) {
      const ex = getExercise(snap.exerciseId);
      diffs.push({ type: 'exerciseRemoved', exerciseId: snap.exerciseId, name: ex ? ex.name : '(Übung)' });
    }
  }
  // Reihenfolge: Vergleich der relativen Reihenfolge der Übungen, die in Plan UND
  // Training vorkommen (neu hinzugefügte/entfernte Übungen zählen dafür nicht extra,
  // die werden über die obigen Diffs abgedeckt).
  const commonInSnapOrder = s.planSnapshot.map(x => x.exerciseId).filter(id => entryMap.has(id));
  const commonSet = new Set(commonInSnapOrder);
  const commonInEntryOrder = s.entries.map(e => e.exerciseId).filter(id => commonSet.has(id));
  if (commonInSnapOrder.length > 1 && commonInSnapOrder.join('|') !== commonInEntryOrder.join('|')) {
    diffs.push({
      type: 'orderChanged',
      orderExerciseIds: s.entries.map(e => e.exerciseId),
      names: s.entries.map(e => e.name),
    });
  }
  // Zirkel/Supersätze: Gruppierungs-Struktur (welche Übungen ohne Pause zusammengehören)
  // zwischen Plan-Schnappschuss und aktuellem Trainingsstand vergleichen. Reine
  // Gruppen-Zusammensetzung zählt, nicht die konkrete groupId (die ist bei einer
  // neu erstellten Gruppe im Training ohnehin immer neu). Erkennung nur anhand der
  // Übungen, die es in BEIDEN Ständen gibt (fairer Vergleich) - zum Übernehmen wird
  // aber die volle aktuelle Gruppierung gespeichert, damit z.B. eine neu hinzugefügte
  // Übung, die direkt mit in den Zirkel aufgenommen wurde, nicht verloren geht.
  const groupsOf = (list, eligible) => {
    const map = new Map();
    list.forEach(x => {
      if (!eligible.has(x.exerciseId) || !x.groupId) return;
      if (!map.has(x.groupId)) map.set(x.groupId, []);
      map.get(x.groupId).push(x.exerciseId);
    });
    return Array.from(map.values()).filter(g => g.length > 1);
  };
  const normalize = groups => groups.map(g => g.slice().sort().join(',')).sort();
  const snapGroupsForCompare = groupsOf(s.planSnapshot, commonSet);
  const entryGroupsForCompare = groupsOf(s.entries, commonSet);
  if (JSON.stringify(normalize(snapGroupsForCompare)) !== JSON.stringify(normalize(entryGroupsForCompare))) {
    const allEntryIds = new Set(s.entries.map(e => e.exerciseId));
    const entryGroupsForApply = groupsOf(s.entries, allEntryIds);
    diffs.push({
      type: 'groupingChanged',
      groups: entryGroupsForApply,
      // Übungen, die VORHER gruppiert waren (auch wenn sie jetzt in keiner Gruppe
      // mehr sind) - werden beim Übernehmen mit gelöst, sonst bliebe eine im
      // Training komplett aufgelöste Gruppe im Plan unverändert bestehen.
      previousGroupedIds: snapGroupsForCompare.flat(),
      groupNames: entryGroupsForApply.map(g => g.map(exId => (entryMap.get(exId) || {}).name || '?')),
    });
  }
  return diffs;
}

// Wendet ausgewählte Diffs (aus computeSessionPlanDiff) auf den zugehörigen
// Trainingstag an (Plan-Vorlage). Nicht ausgewählte Änderungen gelten nur für
// diese eine Einheit. Reihenfolge unabhängig von der Auswahl-Reihenfolge der
// Checkboxen verarbeiten: erst hinzufügen/entfernen/anpassen, Reihenfolge zuletzt
// (sonst würde eine neu hinzugefügte Übung beim Sortieren evtl. noch fehlen).
const DIFF_PRIORITY = { exerciseRemoved: 0, exerciseAdded: 1, restChanged: 2, setsChanged: 2, orderChanged: 3, groupingChanged: 4 };
function applyPlanDiffs(sessionId, changes) {
  const s = getSession(sessionId); if (!s) return { applied: 0 };
  const day = getDay(s.dayId); if (!day) return { applied: 0 };
  let applied = 0;
  const ordered = changes.slice().sort((a, b) => (DIFF_PRIORITY[a.type] ?? 9) - (DIFF_PRIORITY[b.type] ?? 9));
  ordered.forEach(ch => {
    if (ch.type === 'restChanged' || ch.type === 'setsChanged') {
      const item = day.exercises.find(x => x.exerciseId === ch.exerciseId);
      if (!item) return;
      if (ch.type === 'restChanged') item.restSec = ch.newVal;
      if (ch.type === 'setsChanged') item.sets = ch.newVal;
      applied++;
    } else if (ch.type === 'exerciseAdded') {
      if (!day.exercises.some(x => x.exerciseId === ch.exerciseId)) {
        day.exercises.push({ id: uid('de'), exerciseId: ch.exerciseId, sets: ch.sets, reps: ch.reps, restSec: ch.restSec });
        applied++;
      }
    } else if (ch.type === 'exerciseRemoved') {
      const before = day.exercises.length;
      day.exercises = day.exercises.filter(x => x.exerciseId !== ch.exerciseId);
      if (day.exercises.length !== before) applied++;
    } else if (ch.type === 'orderChanged') {
      const orderIds = ch.orderExerciseIds;
      day.exercises.sort((a, b) => {
        const ia = orderIds.indexOf(a.exerciseId), ib = orderIds.indexOf(b.exerciseId);
        if (ia === -1 && ib === -1) return 0;
        if (ia === -1) return 1;
        if (ib === -1) return -1;
        return ia - ib;
      });
      applied++;
    } else if (ch.type === 'groupingChanged') {
      // Erst alle betroffenen Übungen aus ihrer bisherigen Gruppe lösen (auch die,
      // die jetzt in gar keiner Gruppe mehr sind), dann die neuen Gruppen (aus dem
      // Training) als zusammenhängende Blöcke neu bilden.
      const touchedExIds = new Set([...ch.groups.flat(), ...(ch.previousGroupedIds || [])]);
      day.exercises.forEach(it => { if (touchedExIds.has(it.exerciseId)) it.groupId = null; });
      ch.groups.forEach(exIds => {
        const itemIds = exIds.map(exId => day.exercises.find(it => it.exerciseId === exId)?.id).filter(Boolean);
        if (itemIds.length >= 2) regroupContiguous(day, itemIds);
      });
      applied++;
    }
  });
  save();
  return { applied };
}

// Letzte abgeschlossene Sätze einer Übung VOR einer bestimmten Einheit (für "letztes Mal").
// Optional auf einen Ort beschränkt (Geräte sind zwischen Gyms nicht vergleichbar).
function lastEntryFor(exerciseId, beforeSessionId = null, locationId = null) {
  const all = sessions(); // absteigend nach startedAt
  const current = beforeSessionId ? getSession(beforeSessionId) : null;
  const cutoff = current ? current.startedAt : Infinity;
  for (const s of all) {
    if (s.id === beforeSessionId) continue;
    if ((s.startedAt || 0) >= cutoff) continue;
    if (locationId && s.locationId !== locationId) continue;
    const e = (s.entries || []).find(en => en.exerciseId === exerciseId && (en.sets || []).some(hasData));
    if (e) return { session: s, entry: e };
  }
  return null;
}

// ---------- Hilfen für Sätze ----------
function hasData(set) {
  return set && (num(set.weight) > 0 || num(set.reps) > 0);
}
function isWorkingDone(set) {
  return set && set.done && num(set.reps) > 0;
}
function num(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }

// Epley-Formel für geschätztes 1RM
function epley1RM(weight, reps) {
  const w = num(weight), r = num(reps);
  if (w <= 0 || r <= 0) return 0;
  if (r === 1) return w;
  return w * (1 + r / 30);
}

// ---------- Statistik je Übung ----------
// Liefert je Einheit (chronologisch aufsteigend) aggregierte Kennzahlen.
// Optional auf einen Ort beschränkt -> getrennte Statistik je Gym.
function exerciseHistory(exerciseId, locationId = null) {
  const rows = [];
  for (const s of db().sessions) {
    if (locationId && s.locationId !== locationId) continue;
    const entries = (s.entries || []).filter(e => e.exerciseId === exerciseId);
    if (!entries.length) continue;
    const workSets = [];
    entries.forEach(e => (e.sets || []).forEach(set => { if (isWorkingDone(set)) workSets.push(set); }));
    if (!workSets.length) continue;
    let volume = 0, maxWeight = 0, best1rm = 0, bestSet = null, totalReps = 0;
    workSets.forEach(set => {
      const w = num(set.weight), r = num(set.reps);
      volume += w * r;
      totalReps += r;
      if (w > maxWeight) maxWeight = w;
      const e1 = epley1RM(w, r);
      if (e1 > best1rm) { best1rm = e1; bestSet = { weight: w, reps: r }; }
    });
    rows.push({
      sessionId: s.id,
      date: s.date,
      startedAt: s.startedAt || 0,
      sets: workSets.map(x => ({ weight: num(x.weight), reps: num(x.reps) })),
      setCount: workSets.length,
      totalReps,
      volume: Math.round(volume),
      maxWeight,
      est1rm: Math.round(best1rm * 10) / 10,
      bestSet,
    });
  }
  rows.sort((a, b) => a.startedAt - b.startedAt);
  return rows;
}

// Persönliche Rekorde je Übung (optional je Ort)
function exercisePRs(exerciseId, locationId = null) {
  const hist = exerciseHistory(exerciseId, locationId);
  const pr = { maxWeight: 0, best1rm: 0, maxVolume: 0, maxReps: 0, sessionsCount: hist.length, lastDate: null, firstDate: null };
  hist.forEach(r => {
    if (r.maxWeight > pr.maxWeight) pr.maxWeight = r.maxWeight;
    if (r.est1rm > pr.best1rm) pr.best1rm = r.est1rm;
    if (r.volume > pr.maxVolume) pr.maxVolume = r.volume;
    r.sets.forEach(s => { if (s.reps > pr.maxReps) pr.maxReps = s.reps; });
  });
  if (hist.length) { pr.firstDate = hist[0].date; pr.lastDate = hist[hist.length - 1].date; }
  return pr;
}

// Übungen, die an einem Ort tatsächlich trainiert wurden (mit abgehakten Sätzen)
function exercisesTrainedAtLocation(locationId) {
  const ids = new Set();
  for (const s of db().sessions) {
    if (locationId && s.locationId !== locationId) continue;
    (s.entries || []).forEach(e => { if ((e.sets || []).some(isWorkingDone)) ids.add(e.exerciseId); });
  }
  return exercises().filter(e => ids.has(e.id));
}

// Trainingsvolumen je Muskelgruppe über einen Zeitraum (Standard: letzte 7 Tage),
// optional auf einen Ort beschränkt. Summiert über ALLE Übungen, die die
// jeweilige Muskelgruppe als Tag tragen (eine Übung kann in mehrere einzahlen).
function muscleVolumeStats(locationId = null, periodDays = 7) {
  const cutoff = Date.now() - periodDays * 86400000;
  const totals = {};
  for (const s of db().sessions) {
    if (locationId && s.locationId !== locationId) continue;
    if (!s.finishedAt || s.finishedAt < cutoff) continue;
    for (const entry of s.entries || []) {
      const ex = getExercise(entry.exerciseId);
      if (!ex || !ex.muscles || !ex.muscles.length) continue;
      let vol = 0;
      (entry.sets || []).forEach(set => { if (isWorkingDone(set)) vol += num(set.weight) * num(set.reps); });
      if (!vol) continue;
      ex.muscles.forEach(m => { totals[m] = (totals[m] || 0) + vol; });
    }
  }
  return Object.entries(totals).map(([muscle, volume]) => ({ muscle, volume: Math.round(volume) })).sort((a, b) => b.volume - a.volume);
}

// ---------- Gesamt-Statistik (übungsübergreifend, je Ort) ----------
// Gesamt-Trainingsvolumen je abgeschlossener Einheit (alle Übungen zusammen),
// chronologisch aufsteigend - für den Gesamt-Trend-Chart auf der Statistik-Seite.
function overallVolumeHistory(locationId = null, limit = 26) {
  const rows = [];
  for (const s of db().sessions) {
    if (locationId && s.locationId !== locationId) continue;
    if (!s.finishedAt) continue;
    let volume = 0, setCount = 0;
    (s.entries || []).forEach(e => (e.sets || []).forEach(set => {
      if (isWorkingDone(set)) { volume += num(set.weight) * num(set.reps); setCount++; }
    }));
    if (!setCount) continue;
    rows.push({ sessionId: s.id, date: s.date, startedAt: s.startedAt || 0, volume: Math.round(volume), setCount });
  }
  rows.sort((a, b) => a.startedAt - b.startedAt);
  return rows.slice(-limit);
}

// Trainingshäufigkeit je Woche über die letzten `weeks` Wochen (Woche 0 = die aktuelle).
function weeklyFrequency(locationId = null, weeks = 8) {
  const now = Date.now();
  const buckets = [];
  for (let i = weeks - 1; i >= 0; i--) {
    const start = now - (i + 1) * 7 * 86400000;
    const end = now - i * 7 * 86400000;
    let count = 0;
    for (const s of db().sessions) {
      if (locationId && s.locationId !== locationId) continue;
      if (!s.finishedAt) continue;
      if (s.finishedAt >= start && s.finishedAt < end) count++;
    }
    buckets.push({ weekIndex: i, count });
  }
  return buckets;
}

// Meisttrainierte Übungen nach Häufigkeit (Anzahl Einheiten mit abgehaktem Satz).
function topExercisesByFrequency(locationId = null, limit = 5) {
  const counts = new Map();
  for (const s of db().sessions) {
    if (locationId && s.locationId !== locationId) continue;
    if (!s.finishedAt) continue;
    (s.entries || []).forEach(e => {
      if ((e.sets || []).some(isWorkingDone)) counts.set(e.exerciseId, (counts.get(e.exerciseId) || 0) + 1);
    });
  }
  return Array.from(counts.entries())
    .map(([exerciseId, count]) => ({ exerciseId, name: (getExercise(exerciseId) || {}).name || '(gelöscht)', count }))
    .sort((a, b) => b.count - a.count)
    .slice(0, limit);
}

// ---------- Beispieldaten (Testdaten für die Statistik, in Einstellungen an/abschaltbar) ----------
// Erzeugt ca. 2 Monate plausibler, abgeschlossener Trainingseinheiten am angegebenen Ort,
// basierend auf dessen TATSÄCHLICHEN Plänen/Trainingstagen (damit Übungs-/Muskelgruppen-
// Statistik realistisch befüllt wird). Leicht ansteigende Gewichte simulieren Fortschritt,
// vereinzelt ausgelassene Termine wirken weniger künstlich. Klar als `demo: true` markiert,
// damit sie jederzeit sauber wieder entfernbar sind, ohne echte Trainingsdaten anzurühren.
function generateDemoSessions(locationId) {
  const loc = getLocation(locationId); if (!loc) return 0;
  const days = plansByLocation(locationId).flatMap(p => daysByPlan(p.id)).filter(d => d.exercises.length);
  if (!days.length) return 0;
  const now = Date.now();
  const totalDays = 60;
  let dayIdx = 0, count = 0;
  for (let daysAgo = totalDays; daysAgo >= 0; daysAgo -= 2) {
    if (Math.random() < 0.15) continue; // vereinzelt ausgelassene Einheiten
    const day = days[dayIdx % days.length];
    dayIdx++;
    const ts = now - daysAgo * 86400000;
    const d = new Date(ts);
    const dateISO = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const progress = (totalDays - daysAgo) / totalDays; // 0..1 über den Zeitraum
    const entries = day.exercises.map(item => {
      const ex = getExercise(item.exerciseId);
      const baseWeight = 20 + Math.random() * 40;
      const sets = [];
      for (let i = 0; i < item.sets; i++) {
        const w = Math.round((baseWeight * (1 + progress * 0.15) + (Math.random() * 4 - 2)) * 2) / 2;
        const r = Math.max(1, Math.round(item.reps + (Math.random() * 4 - 2)));
        sets.push({ weight: Math.max(2.5, w), reps: r, done: true });
      }
      return {
        exerciseId: item.exerciseId, name: ex ? ex.name : 'Übung', unit: ex?.unit || 'kg',
        targetReps: item.reps, targetSets: item.sets, restSec: item.restSec, groupId: item.groupId || null, sets,
      };
    });
    db().sessions.push({
      id: uid('ses'), locationId, planId: day.planId, dayId: day.id, dayName: day.name,
      date: dateISO, startedAt: ts, finishedAt: ts + 45 * 60000,
      emoji: day.emoji, color: day.color, note: '', entries,
      planSnapshot: day.exercises.map(item => ({ exerciseId: item.exerciseId, sets: item.sets, reps: item.reps, restSec: item.restSec, groupId: item.groupId || null })),
      demo: true,
    });
    count++;
  }
  save();
  return count;
}
function removeDemoSessions() {
  const d = db(); d.sessions = d.sessions.filter(s => !s.demo); save();
}
function hasDemoSessions() {
  return db().sessions.some(s => s.demo);
}

// Entfernt NUR die aufgezeichneten Trainingseinheiten (inkl. Papierkorb-Einheiten und
// Beispieldaten) - Orte/Pläne/Trainingstage/Übungsbibliothek bleiben unangetastet.
function wipeSessions() {
  const d = db();
  d.sessions = [];
  d.trashSessions = [];
  d.settings.demoDataEnabled = false;
  save();
}

// Einfache Suche über Pläne, Trainingstage, Übungen und vergangene Trainings hinweg.
function globalSearch(query) {
  const q = String(query || '').trim().toLowerCase();
  if (!q) return { plans: [], days: [], exercises: [], sessions: [] };
  const d = db();
  return {
    plans: d.plans.filter(p => p.name.toLowerCase().includes(q)),
    days: d.days.filter(day => day.name.toLowerCase().includes(q)),
    exercises: d.exercises.filter(e => e.name.toLowerCase().includes(q)),
    sessions: d.sessions.filter(s => (s.dayName || '').toLowerCase().includes(q)).slice(0, 20),
  };
}

// ---------- Kalender ----------
// Map: 'YYYY-MM-DD' -> [ {emoji,color,name,sessionId} ... ]
function sessionsByDate() {
  const map = {};
  for (const s of db().sessions) {
    const key = s.date;
    (map[key] ||= []).push({ emoji: s.emoji, color: s.color, name: s.dayName || 'Training', sessionId: s.id });
  }
  return map;
}

// ---------- Export / Import ----------
function exportData() {
  return JSON.stringify(db(), null, 2);
}
function importData(json, mode = 'replace') {
  const incoming = typeof json === 'string' ? JSON.parse(json) : json;
  if (!incoming || typeof incoming !== 'object') throw new Error('Ungültige Datei');
  if (mode === 'replace') {
    store = Object.assign(DEFAULTS(), incoming);
  } else { // merge
    const d = db();
    ['exercises', 'locations', 'plans', 'days', 'sessions', 'trashExercises', 'trashSessions'].forEach(k => {
      const existing = new Set(d[k].map(x => x.id));
      (incoming[k] || []).forEach(x => { if (!existing.has(x.id)) d[k].push(x); });
    });
    // Muskelgruppen/Geräte-Arten nach Name deduplizieren (nicht nach id) - sonst
    // könnten z.B. zwei "Brust"-Einträge mit unterschiedlicher id entstehen.
    ['muscleGroups', 'equipmentTypes'].forEach(k => {
      const existingNames = new Set(d[k].map(x => x.name.toLowerCase()));
      (incoming[k] || []).forEach(x => {
        if (x.name && !existingNames.has(x.name.toLowerCase())) { d[k].push(x); existingNames.add(x.name.toLowerCase()); }
      });
    });
    // Geräte-Notizen sind pro (Übung, Ort) eindeutig - nach diesem Schlüssel
    // deduplizieren, nicht nach id.
    const existingNoteKeys = new Set(d.exerciseNotes.map(n => n.exerciseId + '|' + n.locationId));
    (incoming.exerciseNotes || []).forEach(n => {

function el(tag, props = {}, children = []) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') n.className = v;

    else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) n.setAttribute(k, v);
  }
  (Array.isArray(children) ? children : [children]).forEach(c => { if (c != null) n.append(c.nodeType ? c : document.createTextNode(c)); });

}

function openModal({ title, body, onMount, footer }) {

function confirmDialog(msg, { danger = false, okText = 'OK' } = {}) {

const BG_BY_THEME = { dark: '#0f1220', light: '#f4f5f9', oled: '#000000', midnight: '#0a0e27', forest: '#0f1912', contrast: '#000000' };
function resolveTheme(theme) {
  if (theme === 'system') {
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  }
  return theme || 'dark';
}
// Akzentfarbe (Hex) um `percent` (-1..1) auf-/abdunkeln, für die zweite Akzentschattierung.
function shade(hex, percent) {
  const n = parseInt(String(hex).replace('#', ''), 16);
  const clamp = v => Math.max(0, Math.min(255, v));
  const r = clamp((n >> 16) + Math.round(255 * percent));
  const g = clamp(((n >> 8) & 0xff) + Math.round(255 * percent));
  const b = clamp((n & 0xff) + Math.round(255 * percent));
  return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
}
function applyDisplaySettings() {
  const s = DB.db().settings;
  const theme = resolveTheme(s.theme);
  document.documentElement.dataset.theme = theme;
  document.documentElement.dataset.fontsize = s.fontSize || 'medium';
  document.documentElement.dataset.reducedMotion = s.reducedMotion ? '1' : '0';
  const accent = s.accentColor || '#6c8cff';
  document.documentElement.style.setProperty('--accent', accent);
  document.documentElement.style.setProperty('--accent-2', shade(accent, -0.22));
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if (metaTheme) metaTheme.content = BG_BY_THEME[theme] || '#0f1220';
}
if (window.matchMedia) {
  window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {

}

const routes = [];
function route(pattern, handler) {
  const keys = [];
  const rx = new RegExp('^' + pattern.replace(/:[^/]+/g, m => { keys.push(m.slice(1)); return '([^/]+)'; }) + '$');
  routes.push({ rx, keys, handler });
}

function navigate(hash) { location.hash = hash; }

// Pläne ist die neue Startseite (Start-Tab entfällt - hatte keine eigene
// Funktion mehr, nachdem "Laufendes Training" nach Pläne gewandert und
// "Zuletzt" entfernt wurde, da der Kalender diese Übersicht bereits bietet).
function render() {
  const hash = location.hash.replace(/^#/, '') || '/plans';
  for (const r of routes) {
    const m = hash.match(r.rx);
    if (m) {
      const params = {};
      r.keys.forEach((k, i) => params[k] = decodeURIComponent(m[i + 1]));
      window.scrollTo(0, 0);
      try { r.handler(params); } catch (e) { console.error(e); appEl.innerHTML = `<div class="empty">Fehler: ${esc(e.message)}</div>`; }
      updateTabs(hash);
      return;
    }
  }
  navigate('/plans');
}
function updateTabs(hash) {
  let active = 'plans';
  if (hash.startsWith('/plans') || hash.startsWith('/plan') || hash.startsWith('/day') || hash.startsWith('/train')) active = 'plans';
  else if (hash.startsWith('/calendar')) active = 'calendar';
  else if (hash.startsWith('/stats')) active = 'stats';
  else if (hash.startsWith('/library') || hash.startsWith('/exercise')) active = 'library';
  else if (hash.startsWith('/settings')) active = 'settings';
  $$('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === active));
}
window.addEventListener('hashchange', render);

function startTraining(dayId) {
  const s = DB.startSession(dayId);
  if (s) navigate('/train/' + s.id);
}

function moveInArray(arr, id, dir) {
  const i = arr.indexOf(id); const j = i + dir;
  if (i < 0 || j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
}

// Verschiebt das Element an Index `i` in einer Liste (Trainingstag-Übungen ODER
// Trainings-Entries) um eine Position nach oben/unten (dir=-1/+1) - eine zusammen-
// hängende Zirkel-Gruppe (gleiche groupId) wird dabei als EIN Block bewegt, sonst
// würde eine Gruppe auseinandergerissen (Superset-Rendering/Pausenlogik setzen
// lückenlos zusammenhängende groupId-Läufe voraus).
function reorderStep(list, i, dir) {
  const gid = list[i].groupId;
  let start = i, end = i;
  if (gid) {
    while (start > 0 && list[start - 1].groupId === gid) start--;
    while (end < list.length - 1 && list[end + 1].groupId === gid) end++;
  }
  if (dir < 0 && start > 0) {
    let ns = start - 1;
    const ngid = list[ns].groupId;
    if (ngid) { while (ns > 0 && list[ns - 1].groupId === ngid) ns--; }
    const block = list.splice(start, end - start + 1);
    list.splice(ns, 0, ...block);
  } else if (dir > 0 && end < list.length - 1) {
    let ne = end + 1;
    const ngid = list[ne].groupId;
    if (ngid) { while (ne < list.length - 1 && list[ne + 1].groupId === ngid) ne++; }
    const blockLen = end - start + 1;
    const block = list.splice(start, blockLen);
    list.splice(ne - blockLen + 1, 0, ...block);
  }
}

//  Ansicht: Trainingstag-Detail (Übungen mit Zielwerten)
// ============================================================
route('/day/:id', ({ id }) => {
  const day = DB.getDay(id);
  if (!day) return navigate('/plans');
  const plan = DB.getPlan(day.planId);
  const loc = plan ? DB.getLocation(plan.locationId) : null;
  let selectMode = false;
  let reorderMode = false;
  const selected = new Set();

  function draw() {
    const anyMode = selectMode || reorderMode;
    setChrome({ title: `${day.emoji} ${day.name}`, back: true, actions: anyMode ? [] : [actionBtn('✏️', () => editDayModal(id, day.planId))] });

    let html = `${loc ? `<div class="tiny muted" style="margin:-2px 0 10px">${esc(loc.emoji)} ${esc(loc.name)} · ${esc(plan.emoji)} ${esc(plan.name)}</div>` : ''}`;
    if (!anyMode) html += `<button class="btn good block" id="startBtn" style="margin-bottom:16px">▶ Training starten</button>`;
    html += `<div class="section-title" style="display:flex;justify-content:space-between;align-items:center">
      <span>Übungen</span>
      ${selectMode ? `<span class="tiny muted">${selected.size} ausgewählt</span>`
        : reorderMode ? `<span class="tiny muted">Reihenfolge anpassen</span>`
        : (day.exercises.length > 1 ? `<div style="display:flex;gap:6px">
            <button class="btn ghost sm" id="startGroupBtn">🔗 Zirkel erstellen</button>
            <button class="btn ghost sm" id="startReorderBtn">↕ Reihenfolge</button>
          </div>` : '')}
    </div>`;

    if (!day.exercises.length) {
      html += `<div class="empty"><div class="big">📚</div><div>Noch keine Übungen.</div>
        <div class="tiny" style="margin:8px 0 0">Füge Übungen aus deiner Bibliothek hinzu.</div></div>`;
    } else if (selectMode) {
      html += `<p class="tiny muted" style="margin-top:0">Wähle 2 oder mehr Übungen, die als Zirkel ohne Pause dazwischen trainiert werden sollen.</p>`;
      day.exercises.forEach(item => { html += dayExerciseCardHTML(item, true, selected); });
    } else if (reorderMode) {
      html += `<p class="tiny muted" style="margin-top:0">Mit ▲/▼ die Reihenfolge der Übungen ändern. Zirkel-Übungen bewegen sich als Block.</p>`;
      day.exercises.forEach((item, idx) => {
        const ex = DB.getExercise(item.exerciseId);
        html += `<div class="card">
          <div style="display:flex;align-items:center;gap:8px">
            <div class="grow"><b>${item.groupId ? '🔗 ' : ''}${esc(ex ? ex.name : '(gelöscht)')}</b></div>
            <span class="mv" data-up="${item.id}" style="padding:4px 8px;color:${idx === 0 ? 'var(--border)' : 'var(--text-dim2)'};pointer-events:${idx === 0 ? 'none' : 'auto'}">▲</span>
            <span class="mv" data-down="${item.id}" style="padding:4px 8px;color:${idx === day.exercises.length - 1 ? 'var(--border)' : 'var(--text-dim2)'};pointer-events:${idx === day.exercises.length - 1 ? 'none' : 'auto'}">▼</span>
          </div>
        </div>`;
      });
    } else {
      let i = 0;
      while (i < day.exercises.length) {
        const gid = day.exercises[i].groupId;
        if (gid) {
          let j = i;
          while (j < day.exercises.length && day.exercises[j].groupId === gid) j++;
          html += `<div class="superset-wrap"><div class="superset-label" style="display:flex;justify-content:space-between;align-items:center">
            <span>🔗 Zirkel</span><button class="btn ghost sm" data-ungroup="${gid}">Auflösen</button></div>`;
          for (let k = i; k < j; k++) html += dayExerciseCardHTML(day.exercises[k], false, selected);
          html += `</div>`;
          i = j;
        } else {
          html += dayExerciseCardHTML(day.exercises[i], false, selected);
          i++;
        }
      }
    }
    appEl.innerHTML = html;

    if (selectMode) {
      $$('[data-select]', appEl).forEach(n => n.onclick = () => {
        const iid = n.dataset.select;
        selected.has(iid) ? selected.delete(iid) : selected.add(iid);
        draw();
      });
      const bar = el('div', { class: 'select-bar' });
      bar.innerHTML = `<button class="btn ghost" id="cancelGroupBtn">Abbrechen</button>
        <button class="btn primary" id="confirmGroupBtn" ${selected.size < 2 ? 'disabled' : ''}>🔗 Gruppieren (${selected.size})</button>`;
      appEl.append(bar);
      $('#cancelGroupBtn', bar).onclick = () => { selectMode = false; selected.clear(); draw(); };
      $('#confirmGroupBtn', bar).onclick = () => {
        if (selected.size < 2) return;
        DB.groupExercises(id, [...selected]);
        toast('Zirkel erstellt');
        selectMode = false; selected.clear();
        render();
      };
      return;
    }

    if (reorderMode) {
      $$('[data-up]', appEl).forEach(n => n.onclick = () => {
        const idx = day.exercises.findIndex(x => x.id === n.dataset.up);
        if (idx >= 0) reorderStep(day.exercises, idx, -1);
        DB.save(); draw();
      });
      $$('[data-down]', appEl).forEach(n => n.onclick = () => {
        const idx = day.exercises.findIndex(x => x.id === n.dataset.down);
        if (idx >= 0) reorderStep(day.exercises, idx, 1);
        DB.save(); draw();
      });
      const bar = el('div', { class: 'select-bar' });
      bar.innerHTML = `<button class="btn primary block" id="doneReorderBtn">Fertig</button>`;
      appEl.append(bar);
      $('#doneReorderBtn', bar).onclick = () => { reorderMode = false; render(); };
      return;
    }

    const startBtn = $('#startBtn', appEl);
    if (startBtn) startBtn.onclick = () => { if (!day.exercises.length) return toast('Erst Übungen hinzufügen'); startTraining(id); };
    const startGroupBtn = $('#startGroupBtn', appEl);
    if (startGroupBtn) startGroupBtn.onclick = () => { selectMode = true; selected.clear(); draw(); };
    const startReorderBtn = $('#startReorderBtn', appEl);
    if (startReorderBtn) startReorderBtn.onclick = () => { reorderMode = true; draw(); };
    $$('[data-edit]', appEl).forEach(n => n.onclick = () => editDayExerciseModal(id, n.dataset.edit));
    $$('[data-rm]', appEl).forEach(n => n.onclick = async () => {
      if (await confirmDialog('Übung aus diesem Trainingstag entfernen?', { danger: true, okText: 'Entfernen' })) { DB.removeDayExercise(id, n.dataset.rm); render(); }
    });
    $$('[data-ungroup]', appEl).forEach(n => n.onclick = async () => {
      if (await confirmDialog('Zirkel auflösen?', { okText: 'Auflösen' })) { DB.ungroupExercises(id, n.dataset.ungroup); render(); }
    });
    appEl.append(el('button', { class: 'fab', onclick: () => pickExerciseModal(exId => {
      DB.addExerciseToDay(id, exId); render();
    }) }, '+'));
  }
  draw();
});

// Farbige Muskel-/Geräte-Labels wie in der Bibliothek (auch im Training genutzt).
// Farbigkeit ist über Einstellungen -> "Farbige Muskel-/Geräte-Labels" abschaltbar.
function tagBadgesHTML(ex) {
  if (!ex) return '';
  const colored = DB.db().settings.tagColors;
  const mCls = colored ? 'tag-badge muscle' : 'tag-badge neutral';
  const eCls = colored ? 'tag-badge equip' : 'tag-badge neutral';
  const parts = [];
  if (ex.equipment) parts.push(`<span class="${eCls}">${esc(ex.equipment)}</span>`);
  (ex.muscles || []).forEach(m => parts.push(`<span class="${mCls}">${esc(m)}</span>`));
  return parts.length ? `<div class="tag-badges">${parts.join('')}</div>` : '';
}
